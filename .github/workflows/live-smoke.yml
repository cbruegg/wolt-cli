name: Live smoke (weekly)

# Weekly smoke against real Wolt consumer-api endpoints. Detects
# upstream contract drift before users do. Read-only only — no
# login, no cart mutations, no checkout placement, no stats sync.
#
# Required repository secret:
#   WOLT_SMOKE_CONFIG_JSON  contents of ~/.wolt/.wolt-config.json
#
# Seed it in one shot from a logged-in machine:
#   wolt status >/dev/null  # ensures tokens are current on disk
#   gh secret set WOLT_SMOKE_CONFIG_JSON < ~/.wolt/.wolt-config.json
#
# Why the whole config (not just wtoken + wrefresh_token): Wolt binds
# the session to device-level cookies (telemetryDeviceId, activeLocation,
# lantern, etc.). A synthetic config with only __wtoken / __wrtoken
# returns 401 "session expired" even with valid tokens.
#
# Rotation caveat: if Wolt rotates the refresh token on every use,
# the secret will be stale after the first run. Re-seed with the
# same one-liner above.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC ≈ Helsinki morning
  workflow_dispatch:

# Note: deliberately no pull_request / push trigger. The secrets must
# never be available to fork PRs.

permissions:
  contents: read
  issues: write # for the failure-tracker issue thread

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke read-only endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      WOLT_SMOKE_CONFIG_JSON: ${{ secrets.WOLT_SMOKE_CONFIG_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Build wolt
        run: |
          BUILD_VERSION="$(git describe --tags --always --dirty)"
          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${BUILD_VERSION}" \
            -o bin/wolt ./cmd/wolt
          ./bin/wolt --version

      - name: Verify smoke secret is set
        run: |
          if [ -z "${WOLT_SMOKE_CONFIG_JSON}" ]; then
            echo "::error::Required secret WOLT_SMOKE_CONFIG_JSON is missing. See workflow header for seeding instructions."
            exit 1
          fi
          # Sanity-check the secret is well-formed JSON without echoing
          # any of its contents. jq exits non-zero on parse error.
          printf '%s' "${WOLT_SMOKE_CONFIG_JSON}" | jq -e '.account.wtoken | type == "string" and length > 100' >/dev/null \
            || { echo "::error::WOLT_SMOKE_CONFIG_JSON is not valid JSON, or .account.wtoken is missing/short."; exit 1; }

      - name: Run live smoke
        # The script prints only its own status lines and a redacted
        # error tail on failure. Its log is safe to surface publicly;
        # the raw JSON outputs in /tmp/wolt-smoke are never uploaded.
        run: ./scripts/live-smoke.sh

      - name: Step summary
        if: always()
        # Surfaces only endpoint label + pass/fail. No bytes counts, no
        # content snippets — we don't want side-channel signals about
        # the account in a public log either.
        run: |
          {
            echo "## Live smoke results"
            echo ""
            if [ -d /tmp/wolt-smoke ]; then
              echo "| Endpoint | Status |"
              echo "|---|---|"
              for f in /tmp/wolt-smoke/*.json; do
                [ -f "$f" ] || continue
                name="$(basename "$f" .json | tr '_' ' ')"
                err="${f%.json}.err"
                if [ -s "$err" ]; then
                  status="❌"
                else
                  status="✅"
                fi
                printf "| %s | %s |\n" "$name" "$status"
              done
            else
              echo "_No smoke output collected — failed before any endpoint ran._"
            fi
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Wipe local smoke outputs
        if: always()
        # Belt-and-braces: prevent any later step (or future workflow
        # change) from accidentally uploading them as artifacts.
        run: rm -rf /tmp/wolt-smoke

      - name: Open or update tracker issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # De-dupe by fixed title prefix. If an open issue with this
          # prefix exists, append a comment; otherwise file a new one.
          title_prefix="Live smoke failing"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          today="$(date -u +%Y-%m-%d)"
          body=$(
            cat <<EOF
          Weekly live-Wolt smoke failed on **${today}**.

          - Run: ${run_url}
          - Likely causes (in rough order of frequency):
            1. \`WOLT_SMOKE_CONFIG_JSON\` has gone stale (tokens / cookies rotated). Re-seed from a logged-in machine:
               \`\`\`
               wolt status >/dev/null && gh secret set WOLT_SMOKE_CONFIG_JSON < ~/.wolt/.wolt-config.json
               \`\`\`
            2. Wolt changed an endpoint contract (the smoke is doing its job — fix the gateway parser).
            3. Transient Wolt 5xx / 429 burst → rerun via Actions → Live smoke (weekly) → Run workflow.

          See the failed step in the run for the specific endpoint and the pre-flight HTTP trace.
          EOF
          )
          existing="$(gh issue list --state open --search "in:title \"${title_prefix}\"" --json number --jq '.[0].number' || true)"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create \
              --title "${title_prefix} — first observed ${today}" \
              --body "${body}"
          fi
